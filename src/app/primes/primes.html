<main>
  <h1>{{ title }}</h1>
  <div class="prime-grid">
    @for (prime of primes; track prime; let i = $index) {
      <div class="prime-cell">
        <span class="index">{{ i + 1 }}</span>
        <span class="value">{{ prime }}</span>
      </div>
    }
  </div>
  <div class="actions">
    <a class="btn" routerLink="/contact">Enter Contact Info</a>
  </div>
</main>
